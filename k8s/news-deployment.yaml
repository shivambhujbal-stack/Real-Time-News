apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news-backend
  template:
    metadata:
      labels:
        app: news-backend
    spec:
      containers:
      - name: backend
        image: your-dockerhub/news-backend
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: news-backend-service
spec:
  selector:
    app: news-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000